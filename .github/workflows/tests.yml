name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x' # Match the Go minor supported by the pinned linter.
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m ./... ./testdata/browser/server

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.x', stable]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false # This module has no external Go dependencies or go.sum.
      - name: Tests, Examples, and Race Detection
        run: go test -race -coverprofile=coverage.out ./... ./testdata/browser/server
      - name: Vet
        run: go vet ./... ./testdata/browser/server
      - name: Standalone Verification
        run: sh testdata/standalone.sh
      - name: Benchmarks
        if: matrix.go == 'stable'
        run: go test . -run='^$' -bench=. -benchmem -benchtime=500ms

  fuzz:
    name: Bounded Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Fuzz Each Target for 30 Seconds
        run: |
          for target in FuzzTriggerRoundTrip FuzzTriggerAccumulation FuzzLocationRoundTrip FuzzApplyAtomicity FuzzResponseWith; do
            go test . -run='^$' -fuzz="^${target}$" -fuzztime=30s -parallel=2
          done

  browser:
    name: Chromium, Firefox, and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: testdata/browser
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: testdata/browser/package-lock.json
      - name: Install Tooling and Browsers
        run: |
          npm ci
          npm run browsers:install
      - name: Formatting and Fixture Checks
        run: |
          npm run format:check
          npm run test:setup
          npm run test:client
      - name: Browser Tests
        run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-traces
          # Upload only browser diagnostics, not arbitrary files in the results directory.
          path: |
            testdata/browser/test-results/**/trace.zip
            testdata/browser/test-results/**/error-context.md
          include-hidden-files: false
          if-no-files-found: ignore
          retention-days: 7
